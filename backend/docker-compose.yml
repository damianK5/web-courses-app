services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: courses-mysql
    restart: always
    environment:
      MYSQL_DATABASE: coursesdb
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      start_period: 10s 

  # Fake Email Server for Testing (comment if using real email)
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always
    ports:
      - "8025:8025" # The Web UI port (to view emails)
      - "1025:1025" # The fake SMTP port

  # Spring Boot Backend Service
  backend:
    build: .
    container_name: courses-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/coursesdb?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  db_data: